compute:
  gpu: A100                     # 40 GB

environment:
  image: ghcr.io/huggingface/pytorch-cuda:2.3.0-cuda11.8-ubuntu20.04
  env:
    WANDB_API_KEY: $WANDB_API_KEY

run:
  - python model_training/train_lora.py \
        --dataset nobanofi/newsroom-json \
        --base_model mistralai/Mistral-7B-Instruct-v0.2 \
        --model_name mistral-newsroom-lora \
        --push_to_hub \
        --auth_token $HF_TOKEN

# Training configuration
training:
  learning_rate: 2e-4
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  logging_steps: 25
  save_total_limit: 2
  fp16: true
  report_to: "wandb"

# LoRA configuration
lora:
  r: 32
  lora_alpha: 64
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
    - "lm_head"
  bias: "none"
  lora_dropout: 0.05
  task_type: "CAUSAL_LM" 